<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猫咪挤挤车 - 预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f3f7ef; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
canvas { display: block; touch-action: none; box-shadow: 0 8px 32px rgba(0,0,0,0.12); border-radius: 8px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const wx = {
  createCanvas() { return document.getElementById('gameCanvas'); },
  getStorageSync(key) { return localStorage.getItem(key); },
  setStorageSync(key, value) { localStorage.setItem(key, value); },
  getOpenDataContext() { return { canvas: null, postMessage(msg) { console.log('OpenData:', msg); } }; },
  getWindowInfo() { const w = Math.min(420, window.innerWidth), h = Math.min(840, window.innerHeight); return { windowWidth: w, windowHeight: h, pixelRatio: window.devicePixelRatio || 1, safeArea: { top: 0, bottom: h } }; },
  getSystemInfoSync() { return this.getWindowInfo(); },
  getMenuButtonBoundingClientRect() { return null; },
  onTouchStart(cb) { this._touchStart = cb; },
  onTouchMove(cb) { this._touchMove = cb; },
  onTouchEnd(cb) { this._touchEnd = cb; },
  onTouchCancel(cb) { this._touchCancel = cb; },
  onHide(cb) { this._hide = cb; document.addEventListener('visibilitychange', () => { if (document.hidden) cb(); }); },
  onShow(cb) { this._show = cb; document.addEventListener('visibilitychange', () => { if (!document.hidden) cb(); }); },
  onWindowResize(cb) { window.addEventListener('resize', cb); },
  showShareMenu() {},
  onShareAppMessage() {},
  createWebAudioContext() { return new (window.AudioContext || window.webkitAudioContext)(); }
};
const canvas = document.getElementById('gameCanvas');
function getPos(e) { const rect = canvas.getBoundingClientRect(); const touch = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { clientX: touch.clientX - rect.left, clientY: touch.clientY - rect.top }; }
canvas.addEventListener('mousedown', e => { const p = getPos(e); wx._touchStart({ touches: [p] }); });
canvas.addEventListener('mousemove', e => { const p = getPos(e); wx._touchMove && wx._touchMove({ touches: [p] }); });
canvas.addEventListener('mouseup', e => { const p = getPos(e); wx._touchEnd && wx._touchEnd({ changedTouches: [p] }); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const p = getPos(e); wx._touchStart({ touches: [p] }); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = getPos(e); wx._touchMove && wx._touchMove({ touches: [p] }); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); const p = getPos(e); wx._touchEnd && wx._touchEnd({ changedTouches: [p] }); }, { passive: false });
function resizeCanvas() { const scale = Math.min(window.innerWidth / 420, window.innerHeight / 840); canvas.style.width = (420 * scale) + 'px'; canvas.style.height = (840 * scale) + 'px'; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
</script>
<script src="src/data.js"></script>
<script src="src/model.js"></script>
<script src="src/app.js"></script>
<script>
const storageKey = 'cat-bus-club-v1';
let audio;
const app = new CatBusApp.App(canvas, {
  load() { const saved = wx.getStorageSync(storageKey); return saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : null; },
  save(data) { wx.setStorageSync(storageKey, JSON.stringify(data)); },
  raf(callback) { requestAnimationFrame(callback); },
  ensureAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = wx.createWebAudioContext(); if (audio.state === 'suspended') audio.resume(); } catch (_) { audio = null; }
  },
  tone(freq, dur, vol, type, attack, release) {
    if (!audio) return;
    try {
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(vol, t + (attack || 0.01));
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.01);
    } catch (_) {}
  },
  click() {
    if (!audio) return;
    try {
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(440, t + 0.06);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.06, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.1);
    } catch (_) {}
  },
  place() { this.tone(523, 0.1, 0.06, 'sine', 0.005, 0.06); setTimeout(() => this.tone(659, 0.12, 0.05, 'sine', 0.005, 0.08), 55); },
  happy() { this.tone(659, 0.08, 0.05, 'sine', 0.005, 0.05); setTimeout(() => this.tone(784, 0.08, 0.05, 'sine', 0.005, 0.05), 65); setTimeout(() => this.tone(988, 0.14, 0.04, 'sine', 0.005, 0.1), 130); },
  draw() { [523, 659, 784, 988, 1175].forEach((f, i) => { setTimeout(() => this.tone(f, 0.1, 0.03, 'sine', 0.005, 0.06), i * 35); }); },
  feed() { this.tone(440, 0.08, 0.05, 'triangle', 0.005, 0.05); setTimeout(() => this.tone(554, 0.12, 0.04, 'triangle', 0.005, 0.08), 70); },
  advance() {
    if (!audio) return;
    try {
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(523, t + 0.2);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.04, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.35);
    } catch (_) {}
  },
  startBgm() {
    this.ensureAudio();
    if (!audio || this._bgm) return;
    if (this._fadeTimer) { clearTimeout(this._fadeTimer); this._fadeTimer = null; }
    this._bgm = true;
    this._musicGain = audio.createGain();
    this._musicGain.gain.setValueAtTime(0.001, audio.currentTime);
    this._musicGain.gain.linearRampToValueAtTime(0.06, audio.currentTime + 2);
    this._musicGain.connect(audio.destination);
    this._nextNote = audio.currentTime + 0.5;
    this._musicTimer = setInterval(() => this._scheduleMusic(), 180);
  },
  _scheduleMusic() {
    if (!this._bgm || !audio || !this._musicGain) return;
    const ahead = audio.currentTime + 2, scale = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];
    while (this._nextNote < ahead) {
      const time = this._nextNote, freq = scale[Math.floor(Math.random() * scale.length)];
      if (Math.random() > 0.3) {
        const o1 = audio.createOscillator(), o2 = audio.createOscillator(), g = audio.createGain();
        o1.type = 'sine'; o1.frequency.value = freq;
        o2.type = 'triangle'; o2.frequency.value = freq * 2.003;
        g.gain.setValueAtTime(0.001, time);
        g.gain.linearRampToValueAtTime(0.025 + Math.random() * 0.015, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, time + 1.4);
        o1.connect(g); o2.connect(g); g.connect(this._musicGain);
        o1.start(time); o1.stop(time + 1.5); o2.start(time); o2.stop(time + 1.5);
      }
      const step = Math.random() > 0.7 ? 0.35 : 0.5;
      this._nextNote = time + step;
    }
  },
  stopBgm() {
    this._bgm = false;
    if (this._musicTimer) { clearInterval(this._musicTimer); this._musicTimer = null; }
    const gain = this._musicGain;
    this._musicGain = null;
    if (gain && audio) {
      try { gain.gain.setValueAtTime(gain.gain.value, audio.currentTime); gain.gain.linearRampToValueAtTime(0.001, audio.currentTime + 0.8); } catch (_) {}
      this._fadeTimer = setTimeout(() => { try { gain.disconnect(); } catch (_) {} this._fadeTimer = null; }, 1000);
    }
  },
  submitScore() {}, friendRank() {}, friendCanvas() { return null; }
});
function resize() { const info = wx.getWindowInfo(); app.resize(info.windowWidth, info.windowHeight, info.pixelRatio || 1, 0, 0); }
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', () => { resize(); app.startLoop(); }); } else { resize(); app.startLoop(); }
</script>
</body>
</html>
